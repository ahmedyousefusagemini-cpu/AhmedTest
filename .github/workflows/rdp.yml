name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 1. Install WinFsp, Mount Drive, and Map Z: Letter
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          # Download and install WinFsp silently
          Write-Host "Installing WinFsp..."
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi" -OutFile "winfsp.msi"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i winfsp.msi /qn /norestart" -Wait
          
          # Download and install Rclone
          Write-Host "Setting up Rclone..."
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path rclone.zip -DestinationPath .
          $RcloneDir = Get-ChildItem -Directory -Filter "rclone-v*" | Select-Object -ExpandProperty Name
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\rclone"
          Set-Content -Path "$env:APPDATA\rclone\rclone.conf" -Value $env:RCLONE_CONF_DATA
          
          # Add Rclone to system path
          $RclonePath = "$PWD\$RcloneDir"
          echo "$RclonePath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:Path += ";$RclonePath"
          
          # Create the universal mount point
          New-Item -ItemType Directory -Force -Path "C:\VPS_Workspace"
          
          # Start the Live Mount in the background
          Write-Host "Starting live mount..."
          $MountScript = "rclone mount `"gdrive:VPS_Workspace`" `"C:\VPS_Workspace`" --vfs-cache-mode writes"
          Set-Content -Path "C:\MountDrive.ps1" -Value $MountScript
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList "-ExecutionPolicy Bypass -File C:\MountDrive.ps1"
          
          # --- NEW: Windows Startup Drive Mapping ---
          # This creates a script that runs the moment you log into RDP, turning the folder into the Z: drive
          $StartupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          Set-Content -Path "$StartupDir\MapGoogleDrive.cmd" -Value "subst Z: C:\VPS_Workspace"
          # ----------------------------------------
          
          Write-Host "Success! Google Drive is mounted and will appear as Z: upon login."

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = "You know IT"
          $securePass = ConvertTo-SecureString ${{secrets.RDP_PASSWORD}} -AsPlainText -Force
          New-LocalUser -Name "RDPS" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPS"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPS"
          
          echo "RDP_CREDS=User: RDPS | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDPS")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=${{secrets.HOST_NAME}} --unattended=true
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDPS"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
      - name: Logout from Tailscale on cancellation
        if: cancelled()
        run: |
          echo "Logging out from Tailscale due to workflow cancellation.".
          #here we excute
          &"$env:ProgramFiles\Tailscale\tailscale.exe" logout
