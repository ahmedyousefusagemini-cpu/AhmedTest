- name: Clone PacketViwer, Auto-Pull & Create CMD Build Shortcut
        env:
          RDP_GITHUB_PAT: ${{ secrets.RDP_GITHUB_PAT }}
        run: |
          $RepoURL = "https://$env:RDP_GITHUB_PAT@github.com/ahmedyousefusagemini-cpu/PacketViwer.git"
          $DesktopPath = "C:\Users\RDPS\Desktop\PacketViwer"
          
          Write-Host "Cloning PacketViwer repository to RDPS Desktop..."
          git clone $RepoURL $DesktopPath
          
          # Create a CMD desktop shortcut for manual building
          Write-Host "Creating manual CMD build shortcut on Desktop..."
          $WshShell = New-Object -comObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("C:\Users\RDPS\Desktop\Run_Build_PacketViwer_CMD.lnk")
          $Shortcut.TargetPath = "cmd.exe"
          $Shortcut.Arguments = "/k build.bat"
          $Shortcut.WorkingDirectory = "$DesktopPath"
          $Shortcut.Description = "Run PacketViwer Build Manually via CMD"
          $Shortcut.Save()
          
          # Create a smart-polling PowerShell script
          $AutoPullScript = @'
          $RepoPath = "C:\Users\RDPS\Desktop\PacketViwer"
          cd $RepoPath
          
          $lastHash = ""
          
          while ($true) {
              try {
                  # Check the remote HEAD hash directly from GitHub
                  $currentHash = (git ls-remote origin HEAD).ToString().Split("`t")[0]
                  
                  # If the hash changed, pull
                  if (![string]::IsNullOrEmpty($currentHash) -and !([string]::IsNullOrEmpty($lastHash)) -and ($currentHash -ne $lastHash)) {
                      git reset --hard HEAD
                      git pull
                  }
                  
                  # Update the known hash
                  if (![string]::IsNullOrEmpty($currentHash)) {
                      $lastHash = $currentHash
                  }
              } catch {
                  # Silently ignore temporary network drops
              }
              
              Start-Sleep -Seconds 3
          }
          '@
          
          Set-Content -Path "C:\Users\RDPS\Desktop\AutoPuller_PacketViwer.ps1" -Value $AutoPullScript
          
          # Launch the loop script in the background
          Write-Host "Starting instant auto-pull background process for PacketViwer..."
          Start-Process powershell.exe -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Users\RDPS\Desktop\AutoPuller_PacketViwer.ps1"
