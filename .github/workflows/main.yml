name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 1. Setup Rclone and Live Mount (Z Drive)
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          # 1. Create a public shared folder for the RDP user
          New-Item -ItemType Directory -Force -Path "C:\RcloneShared"
          Set-Content -Path "C:\RcloneShared\rclone.conf" -Value $env:RCLONE_CONF_DATA
          
          # 2. Install WinFsp silently (Required for drive mapping)
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi" -OutFile "winfsp.msi"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i winfsp.msi /qn /norestart" -Wait
          
          # 3. Install Rclone
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path rclone.zip -DestinationPath .
          $RcloneDir = Get-ChildItem -Directory -Filter "rclone-v*" | Select-Object -ExpandProperty Name
          Copy-Item -Path ".\$RcloneDir\rclone.exe" -Destination "C:\RcloneShared\rclone.exe"
          
          # 4. Create the Startup Script for the RDP user
          # This forces Google Drive to mount to Z: the second you log in
          $StartupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $VbsContent = 'Set WshShell = CreateObject("WScript.Shell")' + "`r`n" + 'WshShell.Run "C:\RcloneShared\rclone.exe mount gdrive:VPS_Workspace Z: --config ""C:\RcloneShared\rclone.conf"" --vfs-cache-mode writes --volname ""VPS_Drive""", 0, False'
          Set-Content -Path "$StartupDir\MountDrive.vbs" -Value $VbsContent
          
          # 5. Create a Desktop Shortcut directly to the Z: Drive
          $WshShell = New-Object -comObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("C:\Users\Public\Desktop\Google_Drive.lnk")
          $Shortcut.TargetPath = "Z:\"
          $Shortcut.Description = "Live Google Drive"
          $Shortcut.Save()
      - name: Install Sublime Text & Show File Extensions
        run: |
          # --- 1. Install Sublime Text silently ---
          $sublimeUrl = "https://download.sublimetext.com/sublime_text_build_4180_x64_setup.exe"
          $installerPath = "$env:TEMP\sublime_setup.exe"
          Invoke-WebRequest -Uri $sublimeUrl -OutFile $installerPath -UseBasicParsing
          Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES" -Wait
          Remove-Item $installerPath -Force
      
          # Add Sublime Text to PATH for all users
          $sublimePath = "C:\Program Files\Sublime Text"
          [Environment]::SetEnvironmentVariable("Path", "$env:Path;$sublimePath", [EnvironmentVariableTarget]::Machine)
          Write-Host "Sublime Text installed successfully."
      
          # --- 2. Show file extensions in File Explorer ---
          reg load HKU\DefaultUser "C:\Users\Default\NTUSER.DAT"
          Set-ItemProperty -Path "Registry::HKU\DefaultUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "HideFileExt" -Value 0 -Type DWord
          reg unload HKU\DefaultUser
      
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name "HideFileExt" -Value 0 -Type DWord
      
          Write-Host "File extensions are now visible in File Explorer."

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = "You know IT"
          $securePass = ConvertTo-SecureString ${{secrets.RDP_PASSWORD}} -AsPlainText -Force
          New-LocalUser -Name "RDPS" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPS"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPS"
          
          echo "RDP_CREDS=User: RDPS | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDPS")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=${{secrets.HOST_NAME}} --unattended=true
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDPS"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
      - name: Logout from Tailscale on cancellation
        if: cancelled()
        run: |
          echo "Logging out from Tailscale due to workflow cancellation.".
          #here we excute
          &"$env:ProgramFiles\Tailscale\tailscale.exe" logout
