name: RDPWINDOWS

on:
  workflow_dispatch:

concurrency:
  group: rdpwindows
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Create RDP User and Initialize Profile
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name "RDPS" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPS"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPS"

          # Enable RDP service and firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Initialize user profile
          $cred = New-Object System.Management.Automation.PSCredential ("RDPS", $securePass)
          Start-Process -FilePath "cmd.exe" -ArgumentList " /c exit" -Credential $cred -LoadUserProfile -Wait

          if (-not (Get-LocalUser -Name "RDPS")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: 2. Auto-Open Webex in Chrome at RDP Login
        run: |
          $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chromeExe)) {
              $chromeExe = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $chromeExe)) {
              winget install --id Google.Chrome --exact --silent --accept-package-agreements --accept-source-agreements
              $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          }
          if (-not (Test-Path $chromeExe)) {
              Write-Error "Google Chrome is not available"
              exit 1
          }

          # All-users Startup: opens in the RDPS desktop session when they connect via RDP
          $startupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          New-Item -ItemType Directory -Force -Path $startupDir | Out-Null

          $WshShell = New-Object -ComObject WScript.Shell
          $shortcut = $WshShell.CreateShortcut("$startupDir\OpenWebex.lnk")
          $shortcut.TargetPath = $chromeExe
          $shortcut.Arguments = '--no-first-run --no-default-browser-check --new-window "https://signin.webex.com/joinameeting"'
          $shortcut.Description = "Open Webex join-a-meeting page"
          $shortcut.Save()
          Write-Host "Startup shortcut created: $startupDir\OpenWebex.lnk"

      - name: 3. Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList " /i", "`"$installerPath`"", " /quiet", " /norestart" -Wait
          Remove-Item $installerPath -Force

      - name: 4. Establish Tailscale Connection
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY_WINDOWS_RDP }}
          TS_HOSTNAME: ${{ secrets.HOST_NAME_WINDOWS_RDP }}
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $upArgs = @("up", "--authkey=$env:TS_AUTHKEY", "--unattended=true")
          if (-not [string]::IsNullOrWhiteSpace($env:TS_HOSTNAME)) {
              $upArgs += "--hostname=$env:TS_HOSTNAME"
          }
          & $tsExe @upArgs

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: 5. Setup Node.js for the proxy
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 6. Restore free-pi credentials (persistent JWT)
        env:
          FREEPI_CREDENTIALS_JSON: ${{ secrets.FREEPI_CREDENTIALS_JSON }}
        run: |
          $dir = Join-Path $env:USERPROFILE ".free-pi\agent"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:FREEPI_CREDENTIALS_JSON)) {
              Write-Warning "Secret FREEPI_CREDENTIALS_JSON is not set. The proxy will start but return 401 until you add the credentials.json contents as a secret."
          } else {
              # Validate JSON before writing so a bad secret fails loudly here
              $null = $env:FREEPI_CREDENTIALS_JSON | ConvertFrom-Json
              # WriteAllText = UTF-8 without BOM (BOM would break the proxy's JSON.parse)
              [IO.File]::WriteAllText((Join-Path $dir "credentials.json"), $env:FREEPI_CREDENTIALS_JSON)
              Write-Host "free-pi credentials restored to $dir\credentials.json"
          }

      - name: 7. Install and start free-pi proxy (persistent endpoint + key)
        env:
          FREEPI_PROXY_KEY: ${{ secrets.FREEPI_PROXY_KEY }}
          FREEPI_MCP_JSON: ${{ secrets.FREEPI_MCP_JSON }}
          GH_TOKEN: ${{ secrets.RDP_GITHUB_PAT }}
          GH_REPO: ${{ github.repository }}
          TS_HOSTNAME: ${{ secrets.HOST_NAME_WINDOWS_RDP }}
          PROXY_B64: 
          PROXY_MCP_B64: 
        run: |
          $proxyDir = "C:\freepi-proxy"
          New-Item -ItemType Directory -Force -Path $proxyDir | Out-Null
          [IO.File]::WriteAllBytes("$proxyDir\proxy.mjs", [Convert]::FromBase64String($env:PROXY_B64))
          [IO.File]::WriteAllBytes("$proxyDir\mcp.mjs", [Convert]::FromBase64String($env:PROXY_MCP_B64))

          # Optional: MCP servers config from secret (same format as mcp.json)
          if (-not [string]::IsNullOrWhiteSpace($env:FREEPI_MCP_JSON)) {
              $null = $env:FREEPI_MCP_JSON | ConvertFrom-Json
              [IO.File]::WriteAllText("$proxyDir\mcp.json", $env:FREEPI_MCP_JSON)
              Write-Host "MCP config restored to $proxyDir\mcp.json"
          }

          # Firewall: allow 8085 only from the Tailscale CGNAT range
          netsh advfirewall firewall add rule name="free-pi proxy (Tailscale only)" dir=in action=allow protocol=TCP localport=8085 remoteip=100.64.0.0/10 | Out-Null

          # Persistent settings for the watchdog step too
          $env:HOST = "0.0.0.0"   # bind all interfaces; firewall scopes it to Tailscale
          $env:PORT = "8085"
          if ([string]::IsNullOrWhiteSpace($env:FREEPI_PROXY_KEY)) {
              Write-Warning "Secret FREEPI_PROXY_KEY is not set. Using a fallback key 'freepi-proxy-key' - set the secret to control access."
              $env:PROXY_API_KEY = "freepi-proxy-key"
          } else {
              $env:PROXY_API_KEY = $env:FREEPI_PROXY_KEY
          }
          [Environment]::SetEnvironmentVariable("HOST", $env:HOST, "Machine")
          [Environment]::SetEnvironmentVariable("PORT", $env:PORT, "Machine")
          [Environment]::SetEnvironmentVariable("PROXY_API_KEY", $env:PROXY_API_KEY, "Machine")
          # GitHub secret auto-sync from the dashboard (token paste -> secret update)
          if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              [Environment]::SetEnvironmentVariable("GH_TOKEN", $env:GH_TOKEN, "Machine")
              [Environment]::SetEnvironmentVariable("GH_REPO", $env:GH_REPO, "Machine")
              Write-Host "GitHub secret auto-sync: enabled ($env:GH_REPO)"
          } else {
              Write-Warning "Secret RDP_GITHUB_PAT not set - dashboard token paste will save locally but NOT auto-update the GitHub secret."
          }

          Start-Process -FilePath "node" -ArgumentList "`"$proxyDir\proxy.mjs`"" -WindowStyle Hidden

          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
              try {
                  $h = Invoke-RestMethod "http://127.0.0.1:8085/health" -TimeoutSec 2
                  if ($h.ok) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { Write-Error "free-pi proxy failed to start"; exit 1 }

          Write-Host "==================== free-pi PROXY ===================="
          Write-Host " Endpoint : http://$env:TAILSCALE_IP:8085/v1"
          if (-not [string]::IsNullOrWhiteSpace($env:TS_HOSTNAME)) {
              Write-Host " MagicDNS : http://$env:TS_HOSTNAME:8085/v1  (stable across runs)"
          }
          Write-Host " Auth     : Bearer <FREEPI_PROXY_KEY secret>"
          Write-Host " Dashboard: http://$env:TAILSCALE_IP:8085/  (token paste + usage stats)"
          Write-Host " Signed in: $($h.signed_in)"
          Write-Host "========================================================"

      - name: 8. Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: 9. Maintain Connection (RDP + proxy watchdog)
        env:
          FREEPI_PROXY_KEY: ${{ secrets.FREEPI_PROXY_KEY }}
          GH_TOKEN: ${{ secrets.RDP_GITHUB_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDPS"
          Write-Host "=== PROXY ==="
          Write-Host "Endpoint: http://$env:TAILSCALE_IP:8085/v1"
          Write-Host "==================`n"

          # Env the restarted proxy needs (machine-level vars set in step 7 are
          # NOT visible to this already-running process)
          $env:HOST = "0.0.0.0"
          $env:PORT = "8085"
          $env:PROXY_API_KEY = if ([string]::IsNullOrWhiteSpace($env:FREEPI_PROXY_KEY)) { "freepi-proxy-key" } else { $env:FREEPI_PROXY_KEY }
          $env:GH_TOKEN = if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { [Environment]::GetEnvironmentVariable("GH_TOKEN", "Machine") } else { $env:GH_TOKEN }
          $env:GH_REPO = if ([string]::IsNullOrWhiteSpace($env:GH_REPO)) { [Environment]::GetEnvironmentVariable("GH_REPO", "Machine") } else { $env:GH_REPO }

          while ($true) {
              try {
                  $h = Invoke-RestMethod "http://127.0.0.1:8085/health" -TimeoutSec 3
                  if ($h.ok) {
                      Write-Host "[$(Get-Date)] RDP Active - proxy healthy (signed_in=$($h.signed_in), mcp=$($h.mcp_servers.Count))"
                  } else {
                      throw "unhealthy"
                  }
              } catch {
                  Write-Host "[$(Get-Date)] Proxy down or unreachable - restarting node"
                  Start-Process -FilePath "node" -ArgumentList '"C:\freepi-proxy\proxy.mjs"' -WindowStyle Hidden
              }
              Start-Sleep -Seconds 300
          }

      - name: 10. Logout from Tailscale on exit
        if: always()
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $tsExe) { & $tsExe logout }
